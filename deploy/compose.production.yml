services:
  api:
    image: ${LEARNING_API_IMAGE:?Set LEARNING_API_IMAGE to the reviewed immutable image}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      LEARNING_ENVIRONMENT: production
      LEARNING_RUNTIME_DIR: /runtime
      LEARNING_RELEASE_REVISION: ${LEARNING_RELEASE_REVISION:?Set the reviewed 40-character Git revision}
      LEARNING_JWT_SECRET: ${LEARNING_JWT_SECRET:?Set a secret of at least 32 characters}
      LEARNING_AI_MODE: openai
      LEARNING_WEB_CONCURRENCY: ${LEARNING_WEB_CONCURRENCY:-2}
      LEARNING_MAX_UPLOAD_BYTES: ${LEARNING_MAX_UPLOAD_BYTES:-52428800}
      LEARNING_MAX_DOCUMENT_BYTES_PER_OWNER: ${LEARNING_MAX_DOCUMENT_BYTES_PER_OWNER:-2147483648}
      LEARNING_MAX_DOCUMENTS_PER_OWNER: ${LEARNING_MAX_DOCUMENTS_PER_OWNER:-100}
      LEARNING_MAX_AI_OPERATIONS_PER_OWNER_PER_DAY: ${LEARNING_MAX_AI_OPERATIONS_PER_OWNER_PER_DAY:-200}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set the server-side provider key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      LEARNING_GOOGLE_CLIENT_ID: ${LEARNING_GOOGLE_CLIENT_ID:-}
    volumes:
      - runtime:/runtime
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.30.4-alpine3.24@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    user: "101:101"
    read_only: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${LEARNING_HTTPS_BIND:-127.0.0.1:8443}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LEARNING_TLS_DIR:?Set the absolute directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  runtime:
    external: true
    name: ${LEARNING_RUNTIME_VOLUME:?Set the pre-created durable volume name}
