worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;

    log_format safe '$time_iso8601 status=$status method=$request_method request_id=$request_id';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    client_max_body_size 51456k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;

    upstream learning_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        location / {
            limit_req zone=api_per_ip burst=60 nodelay;
            proxy_pass http://learning_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 180s;
        }
    }
}
