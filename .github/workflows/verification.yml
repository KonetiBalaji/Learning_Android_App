name: Backend and Android verification
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Verify the published API contract
        run: |
          python scripts/export-contract.py
          git diff --exit-code -- shared/contracts/openapi.json
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          sdk_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$sdk_tools/sdkmanager" --install "platforms;android-36" "system-images;android-35;google_apis;x86_64"
          printf '%s\n' "$sdk_tools" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build debug APKs and run Android unit tests and lint
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug -PsarasQaInstall=true --console=plain
      - name: Prepare public OCR and embedding models
        run: |
          python scripts/prepare-models.py
          python scripts/prepare-models.py --verify
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run Android emulator tests
        run: bash scripts/ci-android-emulator.sh
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          if-no-files-found: ignore
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*
            ${{ runner.temp }}/saras-emulator/*.log
