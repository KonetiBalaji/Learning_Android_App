name: Quality gate

on:
  push:
    branches: [main, agent/mvp-implementation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject generated artifacts and credential-shaped content
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git ls-files 'artifacts/**')"; then
            echo 'Generated artifacts must not be committed.' >&2
            exit 1
          fi
          if git grep -n -E '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':(exclude)docs/evidence/openmaic-source.lock'; then
            echo 'Credential-shaped content found in tracked files.' >&2
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.7.12
          uv sync --locked --group dev
      - name: Run backend regression
        run: uv run pytest -q

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build locked production image
        run: docker build --pull --tag learning-api:${{ github.sha }} backend
      - name: Smoke test production readiness as non-root
        shell: bash
        run: |
          set -euo pipefail
          image="learning-api:${GITHUB_SHA}"
          container_a="learning-api-a-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_b="learning-api-b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="learning-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker compose -f deploy/compose.production.yml down >/dev/null 2>&1 || true
            docker rm -f "$container_a" "$container_b" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            if test -n "${tls_dir:-}"; then
              chmod u+w "$tls_dir" 2>/dev/null || true
              rm -rf "$tls_dir"
            fi
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          for container in "$container_a" "$container_b"; do
            docker run --detach --name "$container" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=volume,source=$volume,target=/runtime" \
            --publish 127.0.0.1::8000 \
            --env LEARNING_ENVIRONMENT=production \
            --env LEARNING_RELEASE_REVISION="$GITHUB_SHA" \
            --env LEARNING_JWT_SECRET=ci-only-random-secret-over-32-characters \
            --env LEARNING_AI_MODE=openai \
            --env LEARNING_WEB_CONCURRENCY=2 \
            --env OPENAI_API_KEY=ci-placeholder-never-used \
            "$image" >/dev/null
          done
          port_a="$(docker port "$container_a" 8000/tcp | sed 's/.*://')"
          port_b="$(docker port "$container_b" 8000/tcp | sed 's/.*://')"
          for attempt in {1..30}; do
            if payload_a="$(curl --fail --silent --show-error "http://127.0.0.1:${port_a}/ready")" && \
               payload_b="$(curl --fail --silent --show-error "http://127.0.0.1:${port_b}/ready")"; then
              break
            fi
            for container in "$container_a" "$container_b"; do
              if ! docker inspect --format '{{.State.Running}}' "$container" | grep -qx true; then
                docker logs "$container"
                exit 1
              fi
            done
            sleep 1
          done
          for payload in "$payload_a" "$payload_b"; do
            python -c 'import json,sys; value=json.loads(sys.argv[1]); assert value == {"status":"ready","environment":"production","revision":sys.argv[2],"checks":["database","upload_storage"]}' "$payload" "$GITHUB_SHA"
          done
          for container in "$container_a" "$container_b"; do
            test "$(docker inspect --format '{{.Config.User}}' "$container")" = learning
            test "$(docker top "$container" -eo pid,args | grep -c '[s]pawn_main')" -eq 2
          done
          python backend/scripts/production_load_smoke.py \
            "http://127.0.0.1:${port_a}" "http://127.0.0.1:${port_b}" \
            --requests 1400 --concurrency 40
          docker rm -f "$container_a" "$container_b" >/dev/null
          tls_dir="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$tls_dir/privkey.pem" -out "$tls_dir/fullchain.pem" \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 >/dev/null 2>&1
          chmod 0555 "$tls_dir"
          chmod 0444 "$tls_dir/fullchain.pem" "$tls_dir/privkey.pem"
          export LEARNING_API_IMAGE="$image"
          export LEARNING_RELEASE_REVISION="$GITHUB_SHA"
          export LEARNING_JWT_SECRET=ci-only-random-secret-over-32-characters
          export OPENAI_API_KEY=ci-placeholder-never-used
          export LEARNING_RUNTIME_VOLUME="$volume"
          export LEARNING_TLS_DIR="$tls_dir"
          export LEARNING_HTTPS_BIND=127.0.0.1:18443
          docker compose -f deploy/compose.production.yml config --quiet
          docker compose -f deploy/compose.production.yml up --detach --no-build
          for attempt in {1..30}; do
            if tls_payload="$(curl --fail --silent --show-error --cacert "$tls_dir/fullchain.pem" https://localhost:18443/ready)"; then
              break
            fi
            sleep 1
          done
          python -c 'import json,sys; value=json.loads(sys.argv[1]); assert value == {"status":"ready","environment":"production","revision":sys.argv[2],"checks":["database","upload_storage"]}' "$tls_payload" "$GITHUB_SHA"
          api_id="$(docker compose -f deploy/compose.production.yml ps --quiet api)"
          proxy_id="$(docker compose -f deploy/compose.production.yml ps --quiet proxy)"
          docker inspect "$api_id" | python -c 'import json,sys; host=json.load(sys.stdin)[0]["HostConfig"]; assert not host["PublishAllPorts"] and not host["PortBindings"]'
          test "$(docker inspect --format '{{.Config.User}}' "$proxy_id")" = "101:101"
          docker compose -f deploy/compose.production.yml down
          chmod u+w "$tls_dir"
          rm -rf "$tls_dir"
          tls_dir=""

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Run Android regression
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-verification
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 7
