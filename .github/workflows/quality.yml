name: Quality gate

on:
  push:
    branches: [main, agent/mvp-implementation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject generated artifacts and credential-shaped content
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git ls-files 'artifacts/**')"; then
            echo 'Generated artifacts must not be committed.' >&2
            exit 1
          fi
          if git grep -n -E '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':(exclude)docs/evidence/openmaic-source.lock'; then
            echo 'Credential-shaped content found in tracked files.' >&2
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.7.12
          uv sync --locked --group dev
      - name: Run backend regression
        run: uv run pytest -q

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build locked production image
        run: docker build --pull --tag learning-api:${{ github.sha }} backend
      - name: Smoke test production readiness as non-root
        shell: bash
        run: |
          set -euo pipefail
          image="learning-api:${GITHUB_SHA}"
          container="learning-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="learning-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --detach --name "$container" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=volume,source=$volume,target=/runtime" \
            --publish 127.0.0.1::8000 \
            --env LEARNING_ENVIRONMENT=production \
            --env LEARNING_RELEASE_REVISION="$GITHUB_SHA" \
            --env LEARNING_JWT_SECRET=ci-only-random-secret-over-32-characters \
            --env LEARNING_AI_MODE=openai \
            --env OPENAI_API_KEY=ci-placeholder-never-used \
            "$image" >/dev/null
          port="$(docker port "$container" 8000/tcp | sed 's/.*://')"
          for attempt in {1..30}; do
            if payload="$(curl --fail --silent --show-error "http://127.0.0.1:${port}/ready")"; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep -qx true; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          test -n "${payload:-}"
          python -c 'import json,sys; value=json.loads(sys.argv[1]); assert value == {"status":"ready","environment":"production","revision":sys.argv[2],"checks":["database","upload_storage"]}' "$payload" "$GITHUB_SHA"
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = learning
          python backend/scripts/production_load_smoke.py "http://127.0.0.1:${port}" --requests 700 --concurrency 20

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Run Android regression
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-verification
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 7
