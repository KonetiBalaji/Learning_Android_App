name: Quality gate

on:
  push:
    branches: [main, agent/mvp-implementation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject generated artifacts and credential-shaped content
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git ls-files 'artifacts/**')"; then
            echo 'Generated artifacts must not be committed.' >&2
            exit 1
          fi
          if git grep -n -E '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':(exclude)docs/evidence/openmaic-source.lock'; then
            echo 'Credential-shaped content found in tracked files.' >&2
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.7.12
          uv sync --locked --group dev
      - name: Run backend regression
        run: uv run pytest -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK
        run: |
          command -v sdkmanager
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Run Android regression
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-verification
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 7
