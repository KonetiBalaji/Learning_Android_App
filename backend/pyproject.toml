[project]
name = "learning-api"
version = "0.1.0"
description = "Secure local MVP backend for the Learning Android App"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "email-validator>=2.2,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "PyJWT>=2.9,<3.0",
  "python-docx>=1.1,<2.0",
  "PyMuPDF>=1.24,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "openai>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "google-auth[requests]>=2.40,<3.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
